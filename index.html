<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Company AI (Uncensored)</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0b0f19; color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background-color: #111827; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 550px; text-align: center; border: 1px solid #1f2937; }
        h1 { font-size: 24px; color: #10b981; margin-bottom: 5px; }
        p.desc { color: #9ca3af; font-size: 13px; margin-bottom: 20px; }
        
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 14px; color: #9ca3af; margin-bottom: 5px; }
        input { width: 100%; padding: 12px 16px; border: 2px solid #374151; border-radius: 8px; background-color: #030712; color: white; font-size: 15px; outline: none; transition: 0.3s; }
        input:focus { border-color: #10b981; }
        
        button { width: 100%; background-color: #10b981; color: #030712; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        button:hover { background-color: #059669; }
        button:disabled { background-color: #4b5563; cursor: not-allowed; color: #9ca3af; }
        
        .result-box { margin-top: 25px; min-height: 150px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 2px dashed #374151; border-radius: 8px; background-color: #030712; padding: 15px; position: relative; }
        #output-image { max-width: 100%; height: auto; display: none; border-radius: 6px; margin-top: 10px; }
        #status { color: #9ca3af; font-size: 14px; }
        
        .spinner { border: 4px solid rgba(255,255,255,0.1); width: 30px; height: 30px; border-radius: 50%; border-left-color: #10b981; animation: spin 1s linear infinite; display: none; margin-bottom: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <h1>⚡ Fast Private AI</h1>
        <p class="desc">ระบบเจนเนอเรตภาพความเร็วสูง ไร้ข้อจำกัด (สำหรับคนในบริษัทเท่านั้น)</p>
        
        <div class="form-group">
            <label for="company-key">รหัสผ่านยืนยันสิทธิ์บริษัท (Company Passkey):</label>
            <input type="password" id="company-key" placeholder="กรุณาใส่รหัสผ่านเพื่อสิทธิ์เข้าใช้งาน...">
        </div>

        <div class="form-group">
            <label for="prompt-input">คำสั่งสร้างรูปภาพ (Prompt):</label>
            <input type="text" id="prompt-input" placeholder="พิมพ์ไอเดียที่ต้องการได้อย่างอิสระ...">
        </div>

        <button id="generate-btn" onclick="startGeneration()">เริ่มต้นสร้างรูปภาพทันที 🚀</button>

        <div class="result-box">
            <div class="spinner" id="loading-spinner"></div>
            <div id="status">รอยืนยันรหัสผ่านและรับคำสั่ง...</div>
            <img id="output-image" alt="AI Result">
        </div>
    </div>

    <script>
        // รหัสผ่านของบริษัทคุณ
        const CORRECT_PASSWORD = "A&56!oN1@Arm";

        async function startGeneration() {
            const passwordInput = document.getElementById('company-key').value;
            const promptInput = document.getElementById('prompt-input').value.trim();
            const generateBtn = document.getElementById('generate-btn');
            const statusText = document.getElementById('status');
            const spinner = document.getElementById('loading-spinner');
            const outputImage = document.getElementById('output-image');

            // 1. ตรวจสอบรหัสผ่าน
            if (passwordInput !== CORRECT_PASSWORD) {
                alert("❌ รหัสผ่านบริษัทไม่ถูกต้อง!");
                return;
            }

            // 2. ตรวจสอบ Prompt
            if (promptInput === "") {
                alert("กรุณากรอก Prompt ก่อนครับ");
                return;
            }

            // เปิดสเตตัสกำลังโหลด
            generateBtn.disabled = true;
            generateBtn.innerText = "กำลังประมวลผล...";
            outputImage.style.display = "none";
            spinner.style.display = "block";
            statusText.innerText = "กำลังเตรียมคำสั่ง...";

            try {
                let finalPrompt = promptInput;
                const isThai = /[ก-์]/.test(promptInput);
                
                // แปลภาษาไทยเป็นอังกฤษหลังบ้าน เพื่อให้ AI วาดรูปได้แม่นยำที่สุด
                if (isThai) {
                    statusText.innerText = "กำลังแปลงคำสั่งภาษาไทยเป็นภาษาสากล...";
                    const transRes = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=th&tl=en&dt=t&q=${encodeURIComponent(promptInput)}`);
                    const transData = await transRes.json();
                    finalPrompt = transData[0][0][0];
                }

                statusText.innerText = "AI กำลังวาดภาพความเร็วสูง... กรุณารอสักครู่ (ใช้เวลา 3-5 วินาที)";

                // ใช้เทคนิคยิงตรงเข้าโมเดลสาย Uncensored ของ Pollinations โดยการบังคับเปลี่ยนโมเดลใน URL
                const randomSeed = Math.floor(Math.random() * 9999999);
                
                // ใช้โมเดลพิเศษที่ไม่บล็อกคำและตอบสนองไวมาก
                const imageUrl = `https://image.pollinations.ai/p/${encodeURIComponent(finalPrompt)}?width=768&height=768&seed=${randomSeed}&model=evil&nologo=true`;

                // โหลดรูปภาพเข้า Tag <img> ตัวโค้ดจะดึงภาพมาแสดงทันทีที่เซิร์ฟเวอร์เจนเสร็จ
                outputImage.src = imageUrl;

                outputImage.onload = function() {
                    statusText.innerText = "สร้างรูปภาพเสร็จสิ้น! ✨";
                    outputImage.style.display = "block";
                    resetUI();
                };

                outputImage.onerror = function() {
                    statusText.innerText = "เกิดข้อผิดพลาดในการโหลดรูปภาพ กรุณาลองใหม่อีกครั้ง";
                    resetUI();
                };

            } catch (error) {
                console.error(error);
                statusText.innerText = "ระบบเกิดข้อผิดพลาด";
                resetUI();
            }
        }

        function resetUI() {
            document.getElementById('generate-btn').disabled = false;
            document.getElementById('generate-btn').innerText = "เริ่มต้นสร้างรูปภาพทันที 🚀";
            document.getElementById('loading-spinner').style.display = "none";
        }
    </script>
</body>
</html>
