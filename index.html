<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generator</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 24px;
            color: #38bdf8;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #334155;
            border-radius: 8px;
            background-color: #0f172a;
            color: white;
            font-size: 16px;
            margin-bottom: 15px;
            outline: none;
            transition: 0.3s;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background-color: #0ea5e9;
            transform: translateY(-1px);
        }
        button:disabled {
            background-color: #64748b;
            cursor: not-allowed;
        }
        .result-box {
            margin-top: 25px;
            min-height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px dashed #334155;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }
        #output-image {
            max-width: 100%;
            max-height: 400px;
            display: none;
            border-radius: 6px;
        }
        .loading-text {
            display: none;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎨 AI Image Generator</h1>
        <p style="color: #94a3b8; font-size: 14px; margin-top: -10px; margin-bottom: 20px;">พิมพ์ Prompt เป็นภาษาอังกฤษ เพื่อผลลัพธ์ที่ดีที่สุด</p>
        
        <input type="text" id="prompt-input" placeholder="เช่น: a futuristic city, cyberpunk style, 4k...">
        <button id="generate-btn" onclick="generateImage()">สร้างรูปภาพ ✨</button>

        <div class="result-box">
            <span id="placeholder-text" style="color: #64748b;">รูปภาพจะแสดงตรงนี้</span>
            <span id="loading-status" class="loading-text">กำลังวาดรูปให้คุณ... รอสักครู่ ⏳</span>
            <img id="output-image" alt="AI Generated Image">
        </div>
    </div>

    <script>
        function generateImage() {
            const promptInput = document.getElementById('prompt-input').value.trim();
            const generateBtn = document.getElementById('generate-btn');
            const outputImage = document.getElementById('output-image');
            const placeholderText = document.getElementById('placeholder-text');
            const loadingStatus = document.getElementById('loading-status');

            if (promptInput === "") {
                alert("กรุณาพิมพ์ Prompt ก่อนครับ!");
                return;
            }

            // เปิดสถานะกำลังโหลด
            generateBtn.disabled = true;
            generateBtn.innerText = "กำลังสร้างรูป...";
            placeholderText.style.display = "none";
            outputImage.style.display = "none";
            loadingStatus.style.display = "block";

            // เข้ารหัสข้อความเพื่อให้ปลอดภัยต่อการส่งผ่าน URL (แก้ปัญหาเว้นวรรค)
            const encodedPrompt = encodeURIComponent(promptInput);
            
            // ใช้ API ของ Pollinations AI (ฟรี ไม่ต้องใช้คีย์)
            // ใส่เลขสุ่ม (seed) ด้านหลัง เพื่อให้รูปที่ได้ไม่ซ้ำกันทุกครั้งที่กด
            const randomSeed = Math.floor(Math.random() * 100000);
            const imageUrl = `https://image.pollinations.ai/p/${encodedPrompt}?width=500&height=500&seed=${randomSeed}&nologo=true`;

            // โหลดรูปภาพ
            outputImage.src = imageUrl;

            // เมื่อรูปภาพโหลดเสร็จแล้ว
            outputImage.onload = function() {
                loadingStatus.style.display = "none";
                outputImage.style.display = "block";
                generateBtn.disabled = false;
                generateBtn.innerText = "สร้างรูปภาพ ✨";
            };

            // กรณีเกิดข้อผิดพลาด
            outputImage.onerror = function() {
                alert("เกิดข้อผิดพลาดในการสร้างรูปภาพ กรุณาลองใหม่อีกครั้ง");
                loadingStatus.style.display = "none";
                placeholderText.style.display = "block";
                generateBtn.disabled = false;
                generateBtn.innerText = "สร้างรูปภาพ ✨";
            };
        }
    </script>
</body>
</html>
