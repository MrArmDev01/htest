<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Uncensored Web Search</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #060814; color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background-color: #0f1222; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 100%; max-width: 700px; text-align: center; border: 1px solid #b91c1c; }
        h1 { font-size: 24px; color: #ef4444; margin-bottom: 5px; }
        p.desc { color: #9ca3af; font-size: 13px; margin-bottom: 20px; }
        
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 14px; color: #9ca3af; margin-bottom: 5px; }
        input { width: 100%; padding: 12px 16px; border: 2px solid #374151; border-radius: 8px; background-color: #03050a; color: white; font-size: 15px; outline: none; transition: 0.3s; }
        input:focus { border-color: #ef4444; }
        
        button { width: 100%; background-color: #ef4444; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        button:hover { background-color: #b91c1c; }
        button:disabled { background-color: #4b5563; cursor: not-allowed; }
        
        .result-area { margin-top: 25px; text-align: left; }
        #status { text-align: center; color: #9ca3af; font-size: 14px; margin-bottom: 15px; }
        
        /* สไตล์ผลการค้นหาเว็บจริง */
        .search-card { background: #181c33; margin-bottom: 15px; border-radius: 8px; overflow: hidden; border: 1px solid #2d3154; padding: 15px; transition: 0.2s; }
        .search-card:hover { border-color: #ef4444; transform: translateY(-1px); }
        .search-title { font-size: 16px; font-weight: bold; color: #38bdf8; margin-bottom: 5px; text-decoration: none; display: block; }
        .search-title:hover { text-decoration: underline; }
        .search-url { font-size: 12px; color: #10b981; margin-bottom: 8px; word-break: break-all; }
        .search-snippet { font-size: 13px; color: #9ca3af; line-height: 1.4; }
        
        .spinner { border: 4px solid rgba(255,255,255,0.1); width: 30px; height: 30px; border-radius: 50%; border-left-color: #ef4444; animation: spin 1s linear infinite; display: none; margin: 0 auto 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔞 Enterprise Uncensored Live Search</h1>
        <p class="desc">ระบบสืบค้นสื่อผู้ใหญ่และอนิเมะ 18+ จากอินเทอร์เน็ตแบบเรียลไทม์ (จำกัดเฉพาะวงใน)</p>
        
        <div class="form-group">
            <label for="company-key">รหัสผ่านยืนยันสิทธิ์บริษัท (Company Passkey):</label>
            <input type="password" id="company-key" placeholder="กรุณาใส่รหัสผ่านเพื่อเข้าสู่ระบบ...">
        </div>

        <div class="form-group">
            <label for="search-input">คำคำค้นหาที่ต้องการ (ระบบจะค้นหาจากเว็บผู้ใหญ่และคลังอนิเมะทั่วโลก):</label>
            <input type="text" id="search-input" placeholder="พิมพ์ชื่อเรื่อง, รหัส, หรือแนวที่ต้องการค้นหาจริง...">
        </div>

        <button id="search-btn" onclick="executeLiveSearch()">ค้นหาบนเครือข่ายเสรี 🚀</button>

        <div class="result-area">
            <div class="spinner" id="loading-spinner"></div>
            <div id="status">ระบบสแตนบาย รอยืนยันสิทธิ์จากรหัสผ่าน...</div>
            <div id="media-list"></div>
        </div>
    </div>

    <script>
        // รหัสผ่านของบริษัทคุณ
        const CORRECT_PASSWORD = "A&56!oN1@Arm";

        async function executeLiveSearch() {
            const passwordInput = document.getElementById('company-key').value;
            const searchInput = document.getElementById('search-input').value.trim();
            const searchBtn = document.getElementById('search-btn');
            const statusText = document.getElementById('status');
            const spinner = document.getElementById('loading-spinner');
            const mediaList = document.getElementById('media-list');

            // 1. ตรวจสอบรหัสผ่าน
            if (passwordInput !== CORRECT_PASSWORD) {
                alert("❌ รหัสผ่านไม่ถูกต้อง! ปฏิเสธการเข้าถึงระบบค้นหาขั้นสูง");
                return;
            }

            // 2. ตรวจสอบช่องค้นหา
            if (searchInput === "") {
                alert("กรุณากรอกคีย์เวิร์ดที่ต้องการค้นหาครับ");
                return;
            }

            // เปิดโหลดดิ้ง
            searchBtn.disabled = true;
            searchBtn.innerText = "กำลังเจาะระบบค้นหา...";
            mediaList.innerHTML = "";
            spinner.style.display = "block";
            statusText.innerText = "กำลังค้นหาข้อมูลสดจากอินเทอร์เน็ตแบบปิดระบบกรองคำ (SafeSearch=OFF)...";

            try {
                // ดึงข้อมูลโดยใช้ proxy/api ค้นหาของ DuckDuckGo ข้อมูลตรง (HTML/JSON Open Endpoint)
                // ระบบนี้จะไม่ทำการกรองคำค้นหา ทำให้เข้าถึงลิงก์ของเว็บ 18+ และอนิเมะผู้ใหญ่ได้จริงตามที่พิมพ์
                const targetUrl = `https://api.duckduckgo.com/?q=${encodeURIComponent(searchInput)}&format=json&no_html=1&skip_disambig=1`;
                
                const response = await fetch(targetUrl);
                const data = await response.json();
                
                spinner.style.display = "none";
                
                // ตรวจสอบข้อมูลแบบคลังความรู้/ลิงก์โดยตรง (RelatedTopics)
                if ((!data.RelatedTopics || data.RelatedTopics.length === 0) && !data.AbstractURL) {
                    // แนะนำทางเลือกกรณี API ตัวตรงไม่แสดงผลลัพธ์เฉพาะทาง
                    statusText.innerText = "⚠️ ดึงข้อมูลด่วนจำกัดเนื่องจากข้อจำกัด CORS ของบราวเซอร์";
                    
                    const card = document.createElement('div');
                    card.className = 'search-card';
                    card.innerHTML = `
                        <a href="https://duckduckgo.com/?q=${encodeURIComponent(searchInput)}&kp=-2" target="_blank" class="search-title">
                            🔗 คลิกเพื่อเปิดระบบค้นหาอิสระภายนอก (Uncensored Live Search)
                        </a>
                        <div class="search-url">https://duckduckgo.com/?q=${searchInput}</div>
                        <p class="search-snippet">ระบบเซ็ตค่าให้ลิงก์นี้เปิดการค้นหาแบบ <strong>SafeSearch = OFF (-2)</strong> เรียบร้อยแล้ว พนักงานในบริษัทสามารถคลิกเพื่อเข้าไปดูรายชื่อหนังและอนิเมะ 18+ บนเว็บภายนอกได้โดยตรงทันทีครับ</p>
                    `;
                    mediaList.appendChild(card);
                    resetUI();
                    return;
                }

                statusText.innerText = "พบลิงก์ข้อมูลที่เกี่ยวข้องบนอินเทอร์เน็ต:";

                // แสดงข้อมูลหลักหากมีในฐานระบบ
                if(data.AbstractURL) {
                    createCard(data.AbstractText, data.AbstractURL, data.Heading, mediaList);
                }

                // วนลูปแสดงลิงก์เว็บจริงที่เกี่ยวข้องทั้งหมด
                data.RelatedTopics.slice(0, 10).forEach(topic => {
                    if (topic.FirstURL && topic.Text) {
                        createCard(topic.Text, topic.FirstURL, topic.Text.split('-')[0], mediaList);
                    }
                });

            } catch (error) {
                console.error(error);
                statusText.innerText = "ระบบสืบค้นขัดข้องเนื่องจากความปลอดภัยเครือข่าย";
            }
            
            resetUI();
        }

        function createCard(text, url, heading, targetContainer) {
            const card = document.createElement('div');
            card.className = 'search-card';
            card.innerHTML = `
                <a href="${url}" target="_blank" class="search-title">🌐 ${heading}</a>
                <div class="search-url">${url}</div>
                <p class="search-snippet">${text}</p>
            `;
            targetContainer.appendChild(card);
        }

        function resetUI() {
            document.getElementById('search-btn').disabled = false;
            document.getElementById('search-btn').innerText = "ค้นหาบนเครือข่ายเสรี 🚀";
            document.getElementById('loading-spinner').style.display = "none";
        }
    </script>
</body>
</html>
