<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Company AI (Uncensored)</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #090d16; color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background-color: #111827; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 550px; text-align: center; border: 1px solid #1f2937; }
        h1 { font-size: 24px; color: #10b981; margin-bottom: 5px; }
        p.desc { color: #9ca3af; font-size: 13px; margin-bottom: 20px; }
        
        /* สไตล์ฟอร์ม */
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 14px; color: #9ca3af; margin-bottom: 5px; }
        input { width: 100%; padding: 12px 16px; border: 2px solid #374151; border-radius: 8px; background-color: #030712; color: white; font-size: 15px; outline: none; transition: 0.3s; }
        input:focus { border-color: #10b981; }
        
        button { width: 100%; background-color: #10b981; color: #030712; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        button:hover { background-color: #059669; }
        button:disabled { background-color: #4b5563; cursor: not-allowed; color: #9ca3af; }
        
        /* พื้นที่แสดงผล */
        .result-box { margin-top: 25px; min-height: 25px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 2px dashed #374151; border-radius: 8px; background-color: #030712; padding: 15px; position: relative; }
        #output-image { max-width: 100%; height: auto; display: none; border-radius: 6px; margin-top: 10px; }
        #status { color: #9ca3af; font-size: 14px; }
        
        /* ตัวหมุนโหลด */
        .spinner { border: 4px solid rgba(255,255,255,0.1); width: 30px; height: 30px; border-radius: 50%; border-left-color: #10b981; animation: spin 1s linear infinite; display: none; margin-bottom: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔒 Private Company AI</h1>
        <p class="desc">ระบบเจนเนอเรตภาพอิสระ (เข้าถึงเฉพาะคนในบริษัทเท่านั้น)</p>
        
        <div class="form-group">
            <label for="company-key">รหัสผ่านยืนยันสิทธิ์บริษัท (Company Passkey):</label>
            <input type="password" id="company-key" placeholder="กรุณาใส่รหัสผ่านเพื่อเปิดสิทธิ์ใช้งาน...">
        </div>

        <div class="form-group">
            <label for="prompt-input">คำสั่งสร้างรูปภาพ (Prompt):</label>
            <input type="text" id="prompt-input" placeholder="พิมพ์ไอเดียหรือคำสั่งที่ต้องการได้อิสระ...">
        </div>

        <button id="generate-btn" onclick="startGeneration()">เริ่มต้นสร้างรูปภาพ 🚀</button>

        <div class="result-box">
            <div class="spinner" id="loading-spinner"></div>
            <div id="status">รอยืนยันรหัสผ่านและรับคำสั่ง...</div>
            <img id="output-image" alt="AI Result">
        </div>
    </div>

    <script>
        // รหัสผ่านระบบที่คุณกำหนดไว้ภายในบริษัทของคุณ
        const CORRECT_PASSWORD = "A&56!oN1@Arm";

        async function startGeneration() {
            const passwordInput = document.getElementById('company-key').value;
            const promptInput = document.getElementById('prompt-input').value.trim();
            const generateBtn = document.getElementById('generate-btn');
            const statusText = document.getElementById('status');
            const spinner = document.getElementById('loading-spinner');
            const outputImage = document.getElementById('output-image');

            // 1. ตรวจสอบรหัสผ่าน
            if (passwordInput !== CORRECT_PASSWORD) {
                alert("❌ รหัสผ่านบริษัทไม่ถูกต้อง! ไม่มีสิทธิ์ใช้งานระบบนี้");
                return;
            }

            // 2. ตรวจสอบ Prompt
            if (promptInput === "") {
                alert("กรุณากรอก Prompt ก่อนใช้งานครับ");
                return;
            }

            // เปิดสเตตัสกำลังโหลด
            generateBtn.disabled = true;
            generateBtn.innerText = "กำลังประมวลผล...";
            outputImage.style.display = "none";
            spinner.style.display = "block";
            statusText.innerText = "กำลังส่งคำสั่งเข้าสู่ระบบ Cloud Uncensored...";

            try {
                // ยิงข้อความไปแปลงภาษาไทยเป็นอังกฤษก่อน เพื่อให้ AI วาดรูปได้ตรงตามคำสั่งมากที่สุด
                let finalPrompt = promptInput;
                const isThai = /[ก-์]/.test(promptInput);
                if (isThai) {
                    statusText.innerText = "กำลังแปลงคำสั่งภาษาไทย...";
                    const transRes = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=th&tl=en&dt=t&q=${encodeURIComponent(promptInput)}`);
                    const transData = await transRes.json();
                    finalPrompt = transData[0][0][0];
                }

                statusText.innerText = "ส่งคำสั่งเข้า AI Server แล้ว... กำลังต่อคิววาดรูป (อาจใช้เวลา 10-30 วินาที)";

                // ส่งคำร้องขอสร้างรูปภาพไปยัง AI Horde (ใช้โมเดลอิสระที่ปลดล็อกการจำกัดคำ)
                const response = await fetch("https://stablehorde.net/api/v2/generate/async", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "apikey": "0000000000" // ใช้ Anonymous key สาธารณะของ Horde 
                    },
                    body: JSON.stringify({
                        "prompt": finalPrompt + ", highly detailed, masterpiece",
                        "params": {
                            "sampler_name": "k_euler",
                            "cfg_scale": 7,
                            "width": 512,
                            "height": 512,
                            "steps": 25,
                            "n": 1
                        },
                        "models": ["HordeDiffusion"] 
                    })
                });

                const data = await response.json();
                const requestId = data.id;

                if (!requestId) {
                    throw new Error("เซิร์ฟเวอร์ปฏิเสธคำสั่ง");
                }

                // วนลูปเช็คสถานะจนกว่ารูปจะวาดเสร็จ (Polling)
                checkStatus(requestId);

            } catch (error) {
                console.error(error);
                alert("เกิดข้อผิดพลาดจากเซิร์ฟเวอร์ AI กรุณาลองอีกครั้งในอีกสักครู่");
                resetUI();
            }
        }

        async function checkStatus(id) {
            const statusText = document.getElementById('status');
            const outputImage = document.getElementById('output-image');

            const checkInterval = setInterval(async () => {
                try {
                    const res = await fetch(`https://stablehorde.net/api/v2/generate/check/${id}`);
                    const checkData = await res.json();

                    if (checkData.done) {
                        clearInterval(checkInterval);
                        statusText.innerText = "กำลังดาวน์โหลดรูปภาพ...";
                        
                        // ดึงภาพที่เสร็จสมบูรณ์ออกมาแสดงผล
                        const statusRes = await fetch(`https://stablehorde.net/api/v2/generate/status/${id}`);
                        const finalData = await statusRes.json();
                        
                        if (finalData.generations && finalData.generations[0]) {
                            outputImage.src = finalData.generations[0].img;
                            outputImage.style.display = "block";
                            statusText.innerText = "สร้างรูปภาพเสร็จสิ้น! ✨";
                        } else {
                            statusText.innerText = "เกิดข้อผิดพลาดในการดึงข้อมูลภาพ";
                        }
                        resetUI();
                    } else {
                        statusText.innerText = `AI กำลังวาด... คิวในระบบ: ${checkData.wait_time} วินาที`;
                    }
                } catch (err) {
                    clearInterval(checkInterval);
                    statusText.innerText = "ระบบเช็คสถานะขัดข้อง";
                    resetUI();
                }
            }, 3000); // เช็คสถานะทุกๆ 3 วินาที
        }

        function resetUI() {
            document.getElementById('generate-btn').disabled = false;
            document.getElementById('generate-btn').innerText = "เริ่มต้นสร้างรูปภาพ 🚀";
            document.getElementById('loading-spinner').style.display = "none";
        }
    </script>
</body>
</html>
