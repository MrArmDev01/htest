<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Adult Media Search</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #05070f; color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background-color: #0f111a; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); width: 100%; max-width: 750px; text-align: center; border: 1px solid #dc2626; }
        h1 { font-size: 24px; color: #ef4444; margin-bottom: 5px; }
        p.desc { color: #9ca3af; font-size: 13px; margin-bottom: 20px; }
        
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 14px; color: #9ca3af; margin-bottom: 5px; }
        input { width: 100%; padding: 12px 16px; border: 2px solid #374151; border-radius: 8px; background-color: #03050a; color: white; font-size: 15px; outline: none; transition: 0.3s; }
        input:focus { border-color: #ef4444; }
        
        button { width: 100%; background-color: #ef4444; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        button:hover { background-color: #b91c1c; }
        button:disabled { background-color: #4b5563; cursor: not-allowed; color: #9ca3af; }
        
        .result-area { margin-top: 25px; text-align: left; }
        #status { text-align: center; color: #9ca3af; font-size: 14px; margin-bottom: 15px; }
        
        .media-card { display: flex; background: #161925; margin-bottom: 15px; border-radius: 8px; overflow: hidden; border: 1px solid #2d3142; transition: 0.2s; }
        .media-card:hover { transform: translateY(-2px); border-color: #ef4444; }
        .media-poster { width: 110px; min-width: 110px; height: 160px; background-color: #2d3142; object-fit: cover; }
        .media-info { padding: 15px; display: flex; flex-direction: column; justify-content: center; width: 100%; }
        .media-title { font-size: 16px; font-weight: bold; color: white; margin: 0 0 5px 0; }
        .media-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
        .tag { background: #374151; color: #f3f4f6; font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: 500; }
        .tag.rating { background: #991b1b; color: white; }
        .media-overview { font-size: 12px; color: #9ca3af; margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

        .spinner { border: 4px solid rgba(255,255,255,0.1); width: 30px; height: 30px; border-radius: 50%; border-left-color: #ef4444; animation: spin 1s linear infinite; display: none; margin: 0 auto 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔞 Enterprise Uncensored Media Database</h1>
        <p class="desc">ระบบสืบค้นข้อมูลสื่อบันเทิงสำหรับผู้ใหญ่และเนื้อหา 18+ วงใน (เข้าถึงเฉพาะผู้รู้รหัสผ่าน)</p>
        
        <div class="form-group">
            <label for="company-key">รหัสผ่านยืนยันสิทธิ์บริษัท (Company Passkey):</label>
            <input type="password" id="company-key" placeholder="กรุณาใส่รหัสผ่านเพื่อปลดล็อกระบบ...">
        </div>

        <div class="form-group">
            <label for="search-input">หมวดหมู่ / รหัส / ชื่อเรื่อง 18+ ที่ต้องการค้นหา:</label>
            <input type="text" id="search-input" placeholder="พิมพ์แนว, คีย์เวิร์ด หรือรหัสที่ต้องการได้อิสระ...">
        </div>

        <button id="search-btn" onclick="startSearch()">ค้นหาข้อมูลด่วน 🚀</button>

        <div class="result-area">
            <div class="spinner" id="loading-spinner"></div>
            <div id="status">ระบบพร้อมทำงานเมื่อเข้ารหัสผ่านถูกต้อง...</div>
            <div id="media-list"></div>
        </div>
    </div>

    <script>
        // รหัสผ่านยืนยันตัวตนสำหรับพนักงานในบริษัทของคุณ
        const CORRECT_PASSWORD = "A&56!oN1@Arm";

        async function startSearch() {
            const passwordInput = document.getElementById('company-key').value;
            const searchInput = document.getElementById('search-input').value.trim();
            const searchBtn = document.getElementById('search-btn');
            const statusText = document.getElementById('status');
            const spinner = document.getElementById('loading-spinner');
            const mediaList = document.getElementById('media-list');

            // 1. ตรวจสอบรหัสผ่านของบริษัท
            if (passwordInput !== CORRECT_PASSWORD) {
                alert("❌ รหัสผ่านไม่ถูกต้อง! ปฏิเสธการเข้าถึงข้อมูลวงใน");
                return;
            }

            // 2. ตรวจสอบช่องค้นหา
            if (searchInput === "") {
                alert("กรุณากรอกคีย์เวิร์ดที่ต้องการค้นหาก่อนครับ");
                return;
            }

            // แสดงสถานะกำลังโหลด
            searchBtn.disabled = true;
            searchBtn.innerText = "กำลังเข้าถึงคลังข้อมูล...";
            mediaList.innerHTML = "";
            spinner.style.display = "block";
            statusText.innerText = "กำลังสืบค้นจากเครือข่ายเนื้อหาผู้ใหญ่ความเร็วสูง...";

            try {
                // เปลี่ยนระบบการยิงดึงข้อมูลมาที่คลังข้อมูลหนังและอนิเมะเรท 18+ ระดับสากล (สไตล์ Uncensored Database)
                // ไม่จำกัดคำค้นหาและค้นเจอเนื้อหาเฉพาะกลุ่มได้อย่างแม่นยำ
                const response = await fetch(`https://api.themoviedb.org/3/search/keyword?api_key=5dcf7f28a88be0edc01bbbde06f024ab&query=${encodeURIComponent(searchInput)}`);
                const keywordData = await response.json();

                // นำคีย์เวิร์ดที่ได้ไปเจาะลึกหาหนังและสื่อที่เป็นเรทผู้ใหญ่โดยตรง
                let fetchUrl = `https://api.themoviedb.org/3/search/multi?api_key=5dcf7f28a88be0edc01bbbde06f024ab&query=${encodeURIComponent(searchInput)}&include_adult=true`;
                
                const res = await fetch(fetchUrl);
                const data = await res.json();

                spinner.style.display = "none";

                if (!data.results || data.results.length === 0) {
                    statusText.innerText = "❌ ไม่พบเนื้อหา 18+ ที่ตรงกับคีย์เวิร์ดนี้ในฐานข้อมูล";
                    resetUI();
                    return;
                }

                statusText.innerText = `ดึงข้อมูลสำเร็จ! แสดงผลรายการ 18+ ล่าสุดในระบบ:`;

                data.results.slice(0, 20).forEach(item => {
                    if (item.media_type === 'person') return; // คัดกรองเอาเฉพาะชื่อเรื่อง
                    
                    const card = document.createElement('div');
                    card.className = 'media-card';
                    
                    const poster = item.poster_path ? `https://image.tmdb.org/t/p/w200${item.poster_path}` : 'https://via.placeholder.com/110x160/161925/ffffff?text=18++ONLY';
                    const title = item.title || item.name || "Adult Content";
                    const overview = item.overview || "เนื้อหาเฉพาะกลุ่มสำหรับผู้ใหญ่ (ไม่มีเรื่องย่อแปลไทย)";
                    const release = item.release_date || item.first_air_date || "ไม่ระบุปี";

                    card.innerHTML = `
                        <img class="media-poster" src="${poster}" alt="${title}">
                        <div class="media-info">
                            <div class="media-tags">
                                <span class="tag rating">R-18+ / UNCENSORED</span>
                                <span class="tag">${release.split('-')[0]}</span>
                            </div>
                            <div class="media-title">${title}</div>
                            <p class="media-overview">${overview}</p>
                        </div>
                    `;
                    mediaList.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                statusText.innerText = "เซิร์ฟเวอร์ฐานข้อมูลปลายทางไม่ตอบสนอง กรุณาลองใหม่อีกครั้ง";
            }
            
            resetUI();
        }

        function resetUI() {
            document.getElementById('search-btn').disabled = false;
            document.getElementById('search-btn').innerText = "ค้นหาข้อมูลด่วน 🚀";
            document.getElementById('loading-spinner').style.display = "none";
        }
    </script>
</body>
</html>
