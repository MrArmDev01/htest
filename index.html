<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Private Vault</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #060814; color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .container { background-color: #0f1222; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 100%; max-width: 650px; text-align: center; border: 1px solid #b91c1c; }
        h1 { font-size: 24px; color: #ef4444; margin-bottom: 5px; }
        p.desc { color: #9ca3af; font-size: 13px; margin-bottom: 20px; }
        
        .form-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 14px; color: #9ca3af; margin-bottom: 5px; }
        input { width: 100%; padding: 12px 16px; border: 2px solid #374151; border-radius: 8px; background-color: #03050a; color: white; font-size: 15px; outline: none; transition: 0.3s; }
        input:focus { border-color: #ef4444; }
        
        button { width: 100%; background-color: #ef4444; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        button:hover { background-color: #b91c1c; }
        
        .result-area { margin-top: 25px; text-align: left; }
        #status { text-align: center; color: #9ca3af; font-size: 14px; margin-bottom: 15px; }
        
        .media-card { display: flex; background: #181c33; margin-bottom: 15px; border-radius: 8px; overflow: hidden; border: 1px solid #2d3154; padding: 15px; }
        .media-info { display: flex; flex-direction: column; justify-content: center; width: 100%; }
        .media-title { font-size: 16px; font-weight: bold; color: white; margin-bottom: 5px; }
        .tag { background: #991b1b; color: white; font-size: 11px; padding: 2px 6px; border-radius: 4px; font-weight: bold; width: fit-content; margin-bottom: 8px; }
        .media-link { color: #38bdf8; text-decoration: none; font-size: 14px; margin-top: 10px; font-weight: bold; }
        .media-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔒 Private Internal Vault</h1>
        <p class="desc">คลังข้อมูลสื่อผู้ใหญ่และอนิเมะเฉพาะกลุ่มภายในองค์กร (เข้าถึงด้วยรหัสผ่านส่วนตัว)</p>
        
        <div class="form-group">
            <label for="company-key">รหัสผ่านยืนยันสิทธิ์บริษัท (Company Passkey):</label>
            <input type="password" id="company-key" placeholder="กรุณาใส่รหัสผ่าน...">
        </div>

        <div class="form-group">
            <label for="search-input">ค้นหาชื่อเรื่อง หรือแนวอนิเมะที่ต้องการ:</label>
            <input type="text" id="search-input" placeholder="พิมพ์คีย์เวิร์ดเพื่อค้นหาในฐานข้อมูลส่วนตัว...">
        </div>

        <button id="search-btn" onclick="searchVault()">ค้นหาข้อมูลด่วน 🚀</button>

        <div class="result-area">
            <div id="status">ระบบสแตนบาย รอยืนยันสิทธิ์จากรหัสผ่าน...</div>
            <div id="media-list"></div>
        </div>
    </div>

    <script>
        // รหัสผ่านของบริษัทคุณ
        const CORRECT_PASSWORD = "A&56!oN1@Arm";

        // ฐานข้อมูลจำลองภายในบริษัท (คุณและทีมสามารถเพิ่ม ลบ หรือแก้ไขข้อมูลตรงนี้ได้อิสระตามต้องการ)
        const PRIVATE_DATABASE = [
            {
                title: "ตัวอย่างอนิเมะ: มหาศึกต่างโลกเรท 18+ (Isekai Hentai)",
                tags: "HENTAI / ISEKAI",
                description: "เนื้อหาจำลองแนวต่างโลกเฉพาะกลุ่มสำหรับผู้ใหญ่",
                link: "https://example.com/watch-link-1" // ใส่ลิงก์สำหรับกดไปรับชมจริงที่นี่
            },
            {
                title: "ตัวอย่างภาพยนตร์: Cyberpunk Adult Animation",
                tags: "ADULT / SCI-FI",
                description: "อนิเมะแนวไซไฟดาร์ก ๆ เรทผู้ใหญ่ 18+",
                link: "https://example.com/watch-link-2"
            }
        ];

        function searchVault() {
            const passwordInput = document.getElementById('company-key').value;
            const searchInput = document.getElementById('search-input').value.trim().toLowerCase();
            const statusText = document.getElementById('status');
            const mediaList = document.getElementById('media-list');

            // 1. ตรวจสอบรหัสผ่าน
            if (passwordInput !== CORRECT_PASSWORD) {
                alert("❌ รหัสผ่านไม่ถูกต้อง! ปฏิเสธการเข้าถึงคลังข้อมูลวงใน");
                return;
            }

            // 2. ตรวจสอบช่องค้นหา
            if (searchInput === "") {
                alert("กรุณากรอกคีย์เวิร์ดที่ต้องการค้นหา");
                return;
            }

            mediaList.innerHTML = "";
            statusText.innerText = "กำลังค้นหาในคลังข้อมูลส่วนตัว...";

            // ค้นหาข้อมูลที่ตรงกับคำที่พิมพ์
            const results = PRIVATE_DATABASE.filter(item => 
                item.title.toLowerCase().includes(searchInput) || 
                item.tags.toLowerCase().includes(searchInput) ||
                item.description.toLowerCase().includes(searchInput)
            );

            if (results.length === 0) {
                statusText.innerText = "❌ ไม่พบข้อมูลที่ตรงกับคำค้นหานี้ในคลังส่วนตัว";
                return;
            }

            statusText.innerText = `พบข้อมูลในคลังส่วนตัวทั้งหมด ${results.length} รายการ:`;

            // แสดงผลลัพธ์
            results.forEach(item => {
                const card = document.createElement('div');
                card.className = 'media-card';
                card.innerHTML = `
                    <div class="media-info">
                        <span class="tag">${item.tags}</span>
                        <div class="media-title">${item.title}</div>
                        <div style="font-size: 13px; color: #9ca3af;">${item.description}</div>
                        <a href="${item.link}" target="_blank" class="media-link">🔗 คลิกเพื่อเข้าสู่ลิงก์รับชมภายนอก</a>
                    </div>
                `;
                mediaList.appendChild(card);
            });
        }
    </script>
</body>
</html>
